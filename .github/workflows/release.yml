name: release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be semantic and start with v, for example v0.1.0" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/t-cloud-public-rancher-network-controller" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for the controller image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p dist
          helm lint charts/t-cloud-network-controller
          helm package charts/t-cloud-network-controller \
            --destination dist \
            --version "$VERSION" \
            --app-version "$VERSION"

      - name: Log in to GHCR for the Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish Helm chart to GHCR
        env:
          OWNER: ${{ steps.release.outputs.owner }}
          VERSION: ${{ steps.release.outputs.version }}
        run: helm push "dist/t-cloud-network-controller-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"

      - name: Attach Helm chart to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh release upload "$RELEASE_TAG" "dist/t-cloud-network-controller-${VERSION}.tgz" --clobber
