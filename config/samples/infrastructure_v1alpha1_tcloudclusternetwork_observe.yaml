apiVersion: infrastructure.otc.t-systems.com/v1alpha1
kind: TCloudClusterNetwork
metadata:
  name: test-de-existing-network
  namespace: fleet-default
spec:
  clusterRef:
    name: test-de
    namespace: fleet-default
  credentialSecretRef:
    name: cc-replace-me
    namespace: cattle-global-data
  managementPolicy: Observe
  region: eu-de
  projectName: replace-me
  network:
    vpc:
      id: replace-vpc-id
    subnet:
      id: replace-subnet-id
    securityGroup:
      id: replace-security-group-id

